# Blueprint de Render para desplegar una marca de la plantilla (guía: docs/nuevo-cliente.md, sección 4).
# Render → New → Blueprint → elegir este repositorio. Render pide al crear cada variable marcada `sync: false`.
# Para otro cliente: cambiar `name` y el valor de BRAND_NAME (carpeta en config/brand/).
services:
  - type: web
    name: ventimax
    runtime: node
    # VentiMax arranca en el plan free (decisión del dueño, 2026-10-29). El free se apaga tras 15 min sin
    # tráfico: el primer mensaje tras una pausa tarda 30-60 s y el Watchdog y los trabajos programados se
    # detienen mientras duerme. Para clientes con ventas diarias usar `plan: starter` (no se duerme).
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ── Fijas ─────────────────────────────────────────────────────
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: BRAND_NAME
        value: ventimax
      - key: FORCE_CLEAN_SEED
        value: "false"
      # ── Generada por Render (256 bits aleatorios) ─────────────────
      - key: JWT_SECRET
        generateValue: true
      # ── Base de datos y primer administrador ──────────────────────
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS # mínimo 12 caracteres; solo actúa si la base no tiene usuarios
        sync: false
      # ── WhatsApp (Meta) ───────────────────────────────────────────
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: META_APP_ID
        sync: false
      # ── Alertas al administrador (formato 58412...) ───────────────
      - key: ADMIN_PHONE_NUMBER
        sync: false
      - key: ADMIN_PHONE_NUMBER_2
        sync: false
      - key: DELIVERY_PHONE_NUMBER
        sync: false
      # ── IA ────────────────────────────────────────────────────────
      - key: DEEPSEEK_API_KEY
        sync: false
      # ── Imágenes (comprobantes y fotos de producto) ───────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # ── Notificaciones push (npx web-push generate-vapid-keys) ────
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL # mailto:correo@dominio
        sync: false
      # ── Catálogo web: única dirección a la que la API pública responde por CORS ──
      - key: CATALOGO_ORIGEN
        value: https://ventimax-tienda.onrender.com
      # Opcionales (Instagram, Messenger, anuncios, audio): se añaden a mano en Render cuando se activen.
      # Lista completa y comentada en .env.example.

  # ── Catálogo web (F2-3) ───────────────────────────────────────────
  # La tienda vive en otro origen que el panel [R1]. Para otro cliente: cambiar el name y
  # https://ventimax.onrender.com (dirección del servidor) en API_URL y en la CSP; y en el servidor,
  # CATALOGO_ORIGEN con la dirección que Render asigne a este sitio.
  - type: web
    runtime: static
    name: ventimax-tienda
    buildCommand: node catalogo/build.js
    staticPublishPath: catalogo
    headers:
      - path: /*
        name: Content-Security-Policy
        # Nota: https://ventimax.onrender.com (<API_URL>) se cambia por la URL del servidor de cada cliente
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://res.cloudinary.com https://ventimax.onrender.com; connect-src 'self' https://ventimax.onrender.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Cada archivo se confirma con el origen en cada visita (responde 304 si no cambió). Sin esto la CDN guarda
      # cada archivo por separado unos minutos y, tras un despliegue, mezcla el JavaScript nuevo con el CSS viejo
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      - key: API_URL
        value: https://ventimax.onrender.com # Cambiar por la URL del servidor del cliente
