<!doctype html>
<html lang="es">
  <head>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/src/boot/tailwind-config.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: #c1c1c1;
        border-radius: 10px;
      }
      @keyframes pulse-gentle {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.8;
          transform: scale(1.05);
        }
      }
      .animate-pulse-gentle {
        animation: pulse-gentle 3s infinite ease-in-out;
      }
      .nav-button-ai-studio {
        position: relative;
        z-index: 10;
      }
      .nav-button-ai-studio::before {
        content: "";
        position: absolute;
        inset: -2px;
        padding: 2px;
        border-radius: 1rem; /* rounded-2xl approximation */
        background: linear-gradient(135deg, #3b82f6, #10b981);
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
        box-shadow:
          0 0 10px rgba(59, 130, 246, 0.4),
          0 0 10px rgba(16, 185, 129, 0.4);
      }
    </style>
  </head>
  <body
    class="bg-gray-100 dark:bg-gray-900 transition-colors h-screen overflow-hidden font-sans"
  >
    <div id="root">
      <div class="flex flex-col items-center justify-center h-screen bg-gray-100 dark:bg-gray-900 space-y-4">
        <div class="w-10 h-10 border-4 border-emerald-500/30 border-t-emerald-500 rounded-full animate-spin"></div>
        <span class="text-gray-500 dark:text-gray-400 font-medium tracking-wide animate-pulse">Iniciando sistema...</span>
      </div>
    </div>

    <!-- Modales y Toasts Globales -->
    <div
      id="toast"
      class="fixed top-4 right-4 z-[100] transform transition-all duration-300 translate-y-[-150%] opacity-0 bg-white border-l-4 border-emerald-500 shadow-xl rounded-lg p-4 flex items-center space-x-3 max-w-sm"
    ></div>

    <script type="module" src="/src/boot/panel.js"></script>
  </body>
</html>
