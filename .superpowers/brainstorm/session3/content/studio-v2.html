<div class="flex flex-col h-full bg-gray-50 dark:bg-gray-900 font-sans">
    <!-- Header -->
    <div class="p-6 bg-white dark:bg-gray-800 border-b dark:border-gray-700 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black text-gray-800 dark:text-white tracking-tighter uppercase italic">AI Studio <span class="text-emerald-500 text-sm">PRO</span></h1>
            <p class="text-gray-400 text-[10px] font-black uppercase tracking-widest">Galería Persistente Activa</p>
        </div>
        <div class="flex gap-2">
            <button class="bg-gray-100 dark:bg-gray-700 p-2 rounded-xl text-gray-500 hover:text-emerald-500 transition-colors"><i class="fas fa-history"></i></button>
            <button class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-lg shadow-emerald-500/20">Nueva Sesión</button>
        </div>
    </div>

    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar: Configuración -->
        <div class="w-80 bg-white dark:bg-gray-800 border-r dark:border-gray-700 p-6 overflow-y-auto space-y-8">
            <!-- Sección: Destinatarios -->
            <div class="space-y-4">
                <h3 class="text-[10px] font-black uppercase text-gray-400 tracking-widest">Envío Directo</h3>
                <div class="flex items-center gap-3 bg-emerald-50 dark:bg-emerald-500/10 p-3 rounded-2xl border border-emerald-100 dark:border-emerald-500/20">
                    <div class="w-8 h-8 bg-emerald-500 text-white rounded-xl flex items-center justify-center text-xs"><i class="fab fa-whatsapp"></i></div>
                    <div class="flex-1">
                        <p class="text-[10px] font-black">Marcelo (Personal)</p>
                        <p class="text-[9px] text-emerald-600/60 font-medium">+58 412 XXXX</p>
                    </div>
                </div>
            </div>

            <!-- Sección: Generador -->
            <div class="space-y-4">
                <h3 class="text-[10px] font-black uppercase text-gray-400 tracking-widest">Prompt Creativo</h3>
                <textarea class="w-full bg-gray-50 dark:bg-gray-900 border-none rounded-2xl p-4 text-sm focus:ring-2 ring-emerald-500 h-40 resize-none" placeholder="Describe la imagen..."></textarea>
                <button class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black text-xs uppercase tracking-[0.2em] shadow-xl shadow-emerald-500/20 active:scale-95 transition-all">
                    <i class="fas fa-sparkles mr-2"></i> Generar Arte
                </button>
            </div>
        </div>

        <!-- Centro: Galería & Preview -->
        <div class="flex-1 p-6 bg-gray-50 dark:bg-gray-900 flex flex-col space-y-6 overflow-hidden">
            <!-- Galería Horizontal -->
            <div class="flex flex-col space-y-3">
                <h4 class="text-[10px] font-black uppercase text-gray-400 tracking-widest">Historial de Creaciones</h4>
                <div class="flex gap-4 overflow-x-auto pb-4 scrollbar-hide">
                    <div class="flex-shrink-0 w-20 h-20 rounded-xl ring-2 ring-emerald-500 ring-offset-4 overflow-hidden border-2 border-white"><img src="https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?w=200" class="w-full h-full object-cover"></div>
                    <div class="flex-shrink-0 w-20 h-20 rounded-xl overflow-hidden opacity-50 grayscale hover:opacity-100 hover:grayscale-0 transition-all cursor-pointer"><img src="https://images.unsplash.com/photo-1519340241574-2dec39624824?w=200" class="w-full h-full object-cover"></div>
                    <div class="flex-shrink-0 w-20 h-20 rounded-xl overflow-hidden opacity-50 grayscale hover:opacity-100 hover:grayscale-0 transition-all cursor-pointer"><img src="https://images.unsplash.com/photo-1533512930330-4ac257c86793?w=200" class="w-full h-full object-cover"></div>
                </div>
            </div>

            <!-- Preview Principal -->
            <div class="flex-1 flex flex-col items-center justify-center gap-6">
                <div class="w-full max-w-md aspect-square bg-white dark:bg-gray-800 rounded-[3rem] shadow-2xl overflow-hidden relative group border-4 border-white dark:border-gray-800">
                    <img src="https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?w=800" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all">
                        <button class="bg-emerald-500 text-white px-8 py-3 rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl">Enviar a WhatsApp</button>
                    </div>
                </div>

                <!-- Footer: Texto IA -->
                <div class="w-full max-w-md bg-white dark:bg-gray-800 p-6 rounded-[2rem] shadow-lg border border-gray-100 dark:border-gray-700">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Copy para Instagram/Status</span>
                        <button class="text-emerald-500 text-[10px] font-bold"><i class="fas fa-copy"></i></button>
                    </div>
                    <p class="text-xs text-gray-600 dark:text-gray-300 italic leading-relaxed">"Nueva magia en Pachi-Kid 🧸. Estilo y sonrisas. #PachiStyle"</p>
                </div>
            </div>
        </div>
    </div>
</div>
